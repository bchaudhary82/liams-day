[build]
  publish = "public"
  functions = "netlify/functions"

# No build step — the pages are plain HTML/CSS/JS on purpose.
[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# The board must never be served stale by a CDN cache — Melody needs today.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
