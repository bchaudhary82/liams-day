<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf8f2">
<title>Liam's Day — plan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
<style>
  /* Susan's phone. Built for one-handed use in bed, tired. Big targets,
     nothing clever, one explicit save button. */
  :root{
    --bg:#fdf8f2; --card:#fff; --ink:#2f2a26; --muted:#7d736b; --line:#ece3d8;
    --breakfast:#f6c453; --amsnack:#8fc98f; --lunch:#7fb3d5; --pmsnack:#c9a0dc;
    --dinner:#eb9e6f; --notes:#a8a29b; --chores:#9bb0c4;
    --go:#2f6f4e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC",
      "PingFang SC","Hiragino Sans GB",sans-serif;
    font-size:17px;line-height:1.4;padding-bottom:6.5rem;-webkit-text-size-adjust:100%}
  button{font:inherit}

  /* ---------------------------------------------------------- PIN gate */
  #gate{position:fixed;inset:0;background:var(--bg);z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem}
  #gate h1{margin:0;font-size:1.6rem}
  #gate p{margin:0;color:var(--muted);text-align:center}
  #pin{font-size:2rem;letter-spacing:.5em;text-align:center;width:100%;max-width:260px;
    padding:.7rem;border:2px solid var(--line);border-radius:14px;background:#fff;
    color:var(--ink);text-indent:.5em}
  #gate button{background:var(--ink);color:#fff;border:0;border-radius:14px;
    padding:.8rem 2rem;font-size:1.05rem;font-weight:600}
  #gate .err{color:#b3402c;min-height:1.3em;font-size:.95rem}

  header{padding:1.1rem 1rem .5rem}
  h1{margin:0;font-size:1.5rem}
  .sub{color:var(--muted);font-size:.95rem;margin:.15rem 0 0}

  /* The day being planned has to be impossible to misread. v1 had two
     buttons, "Today" and "Tomorrow", and a silent guess between them —
     and saves landed on the wrong day (Sep 7, Oct 26, Nov 9). Every chip
     now carries the real weekday and date. */
  .eyebrow{margin:0;color:var(--muted);font-size:.85rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em}
  .daypick{display:flex;gap:.45rem;padding:.7rem 1rem .2rem;overflow-x:auto;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .daypick::-webkit-scrollbar{display:none}
  .daypick button{flex:none;width:4.4rem;padding:.45rem .2rem .5rem;border-radius:14px;
    border:2px solid var(--line);background:#fff;color:var(--ink);scroll-snap-align:start;
    display:flex;flex-direction:column;align-items:center;gap:.05rem;position:relative}
  .daypick .tag{font-size:.66rem;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;min-height:1em}
  .daypick .wd{font-size:.95rem;font-weight:700}
  .daypick .dn{font-size:1.25rem;font-weight:800;line-height:1.1}
  .daypick .dot{width:.45rem;height:.45rem;border-radius:50%;background:transparent;margin-top:.1rem}
  .daypick .dot.on{background:var(--go)}
  .daypick button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .daypick button[aria-pressed="true"] .tag{color:#e9e1d6}
  .daypick button[aria-pressed="true"] .dot.on{background:#9fd8b4}
  .legend{padding:.15rem 1rem 0;color:var(--muted);font-size:.8rem}
  .legend .dot{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;
    background:var(--go);margin-right:.3rem;vertical-align:middle}
  .warnline{margin:.6rem 1rem 0;padding:.6rem .8rem;border-radius:12px;background:#fdecd9;
    color:#7a3d12;font-size:.92rem;font-weight:600}
  .warnline[hidden]{display:none}
  .every{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:-.35rem 0 .5rem}

  /* Wrong-day check: an in-page card, not a browser pop-up. */
  #ask{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;
    background:rgba(30,25,20,.5);padding:1rem}
  #ask.on{display:flex}
  #ask .card{background:#fff;border-radius:20px;padding:1.2rem 1.1rem calc(1rem + env(safe-area-inset-bottom));
    width:100%;max-width:440px;display:grid;gap:.75rem}
  #ask h3{margin:0;font-size:1.2rem}
  #ask p{margin:0;color:var(--ink)}
  #ask button{padding:.9rem;border-radius:14px;border:0;font-size:1.02rem;font-weight:700}
  #ask .yes{background:var(--go);color:#fff}
  #ask .no{background:#f1eae1;color:var(--ink)}

  .toolbar{display:flex;gap:.5rem;padding:.7rem 1rem 0}
  .ghost{flex:1;padding:.7rem;border-radius:12px;border:2px dashed var(--line);
    background:transparent;color:var(--muted);font-weight:600}

  main{padding:1rem;display:grid;gap:.9rem}
  section{background:var(--card);border-radius:16px;padding:.85rem 1rem 1rem;
    border:1px solid var(--line);border-left:9px solid var(--accent,var(--line))}
  h2{margin:0 0 .5rem;font-size:1.05rem}
  ol{list-style:none;margin:0 0 .6rem;padding:0;display:grid;gap:.4rem}
  ol:empty{margin:0}
  li{display:flex;align-items:center;gap:.5rem;background:#fbf7f1;
    border-radius:11px;padding:.45rem .5rem .45rem .6rem}
  .num{min-width:1.5rem;height:1.5rem;border-radius:50%;background:var(--accent,var(--muted));
    color:#fff;font-size:.8rem;font-weight:700;display:grid;place-items:center;flex:none}
  .txt{flex:1;min-width:0;overflow-wrap:anywhere}
  .zh{display:block;font-size:.8rem;color:var(--muted)}
  .mv{width:2rem;height:2rem;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink);flex:none}
  .mv[disabled]{opacity:.3}
  .rm{width:2rem;height:2rem;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:#b3402c;flex:none;font-size:1.1rem;line-height:1}
  .add{width:100%;padding:.65rem;border-radius:11px;border:2px dashed var(--line);
    background:transparent;color:var(--muted);font-weight:600}

  /* ------------------------------------------------------- bottom sheet */
  #scrim{position:fixed;inset:0;background:rgba(30,25,20,.45);z-index:20;display:none}
  #scrim.on{display:block}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
    border-radius:22px 22px 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    max-height:82vh;display:none;flex-direction:column;gap:.7rem}
  #sheet.on{display:flex}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .sheet-head h3{margin:0;font-size:1.1rem}
  .close{border:0;background:#f1eae1;border-radius:10px;padding:.45rem .8rem;color:var(--muted);font-weight:600}
  .newrow{display:flex;gap:.5rem}
  .newrow input{flex:1;min-width:0;padding:.7rem;border:2px solid var(--line);
    border-radius:12px;background:#fff;color:var(--ink);font-size:1rem}
  .newrow button{background:var(--go);color:#fff;border:0;border-radius:12px;padding:.7rem 1rem;font-weight:600}
  .pool{overflow-y:auto;display:grid;gap:.4rem;padding-bottom:.3rem}
  .pool button{text-align:left;padding:.7rem .8rem;border-radius:12px;border:1px solid var(--line);
    background:#fff;color:var(--ink);display:flex;align-items:center;gap:.6rem}
  .pool button[aria-pressed="true"]{border-color:var(--go);background:#f0f7f2}
  .tick{width:1.4rem;flex:none;color:var(--go);font-weight:700}

  /* -------------------------------------------------------- save bar */
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(253,248,242,.96);
    border-top:1px solid var(--line);padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
    display:flex;gap:.6rem;align-items:center;backdrop-filter:blur(6px)}
  .save{flex:1;background:var(--go);color:#fff;border:0;border-radius:14px;
    padding:.95rem;font-size:1.05rem;font-weight:700;transition:background .15s}
  .save[disabled]{opacity:.7}
  .save.done{background:#1f5c3d}

  /* The confirmation has to be impossible to miss. Susan is tired and needs
     to know it worked without hunting for a small grey line. It covers the
     save button, so the acknowledgement lands where she is already looking. */
  #toast{position:fixed;left:.75rem;right:.75rem;
    bottom:calc(.7rem + env(safe-area-inset-bottom));z-index:40;
    background:var(--go);color:#fff;border-radius:16px;padding:1.05rem 1.1rem;
    font-size:1.05rem;font-weight:600;display:flex;align-items:center;gap:.7rem;
    box-shadow:0 10px 30px rgba(40,30,20,.28);
    transform:translateY(140%);transition:transform .22s ease;pointer-events:none}
  #toast.on{transform:translateY(0);pointer-events:auto}
  #toast.bad{background:#a83a26}
  #toast .mark{font-size:1.4rem;line-height:1;flex:none}
  #toast .msg{flex:1}
  #toast .dismiss{background:rgba(255,255,255,.2);border:0;color:#fff;
    border-radius:10px;padding:.4rem .7rem;font-weight:600;flex:none}
  @media (prefers-reduced-motion:reduce){ #toast{transition:none} }

  .gear{background:transparent;border:0;color:var(--muted);text-decoration:underline;
    padding:.4rem 0;font-size:.95rem}
  @media (min-width:760px){ main{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start} }
</style>
</head>
<body>

<div id="gate">
  <h1>Liam's Day</h1>
  <p>Enter your PIN to plan the day.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off"
         maxlength="8" aria-label="PIN">
  <div class="err" id="gate-err"></div>
  <button onclick="unlock()">Open</button>
</div>

<header>
  <p class="eyebrow">Planning for</p>
  <h1 id="head">&nbsp;</h1>
  <p class="sub" id="sub">&nbsp;</p>
</header>

<div class="daypick" id="daypick" role="group" aria-label="Choose the day to plan"></div>
<p class="legend"><span class="dot"></span>already has a plan</p>
<p class="warnline" id="warnline" hidden></p>

<div class="toolbar">
  <button class="ghost" id="copybtn" onclick="copyLast()">↺ Copy last plan</button>
</div>

<main id="app"></main>

<div style="padding:0 1rem">
  <button class="gear" onclick="openContacts()">⚙ Emergency contacts</button>
</div>

<div class="savebar">
  <button class="save" id="savebtn" onclick="saveAll()">Save</button>
</div>

<div id="toast" role="status" aria-live="assertive">
  <span class="mark" id="toast-mark">✓</span>
  <span class="msg" id="toast-msg"></span>
  <button class="dismiss" id="toast-dismiss" onclick="hideToast()">OK</button>
</div>

<div id="ask" role="alertdialog" aria-modal="true" aria-labelledby="ask-title">
  <div class="card">
    <h3 id="ask-title"></h3>
    <p id="ask-msg"></p>
    <button class="yes" id="ask-yes"></button>
    <button class="no" id="ask-no"></button>
  </div>
</div>

<div id="scrim" onclick="closeSheet()"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-head"><h3 id="sheet-title"></h3>
    <button class="close" onclick="closeSheet()">Done</button></div>
  <div class="newrow">
    <input id="newitem" placeholder="Type something new…" autocomplete="off">
    <button onclick="addNew()">Add</button>
  </div>
  <div class="pool" id="pool"></div>
</div>

<script>
/* ------------------------------------------------------------- sections */
// 'standing' is not part of a day: those notes show every day until Susan
// removes them. 'notes' is now only for a note meant for one day.
const SECTIONS = [
  {key:'breakfast', title:'Breakfast',        pool:'food',   verb:'food'},
  {key:'amSnack',   title:'Morning snack',    pool:'food',   verb:'food'},
  {key:'lunch',     title:'Lunch',            pool:'food',   verb:'food'},
  {key:'pmSnack',   title:'Afternoon snack',  pool:'food',   verb:'food'},
  {key:'dinner',    title:'Family dinner',    pool:'dinner', verb:'a dinner'},
  {key:'standing',  title:'Notes for Melody', pool:'notes',  verb:'a note', accent:'notes',
    every:() => 'Every day, until you remove them'},
  {key:'notes',     title:'Note just for this day', pool:'notes', verb:'a note', accent:'notes',
    every:() => `Only on ${weekday(date)}`},
  {key:'chores',    title:'If there is time', pool:'chores', verb:'a job'},
];
const TZ = 'America/Edmonton';
const PIN_KEY = 'liams-day-pin';
const DAYS_AHEAD = 7;               // today + the next 7 days
const AWAY_MS = 10 * 60 * 1000;     // back after 10 min → re-check the day

let pin = '';
let date = null;          // the day being planned, YYYY-MM-DD
let plan = null;          // that day's lists (plan.notes = one-off notes only)
let standing = [];        // notes shown every day
let library = null;
let contacts = [];
let sheetKey = null;
let dirty = false;
let loadedOn = null;      // what "today" was when this day was loaded
let hiddenAt = 0;
let planned = {};         // date → number of items saved, for the dots
const okayed = new Set(); // dates Susan already confirmed past the wrong-day check

/* localStorage can throw outright in some browsers — guard every touch. */
const remember=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const recall=(k)=>{try{return localStorage.getItem(k)}catch(e){return null}};
const esc = (s) => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (d,o)=>new Intl.DateTimeFormat('en-CA',o).format(d);

/* ---------------------------------------------------------------- dates */
function todayLocal(){
  return fmt(new Date(),{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
}
function localHour(){
  return Number(fmt(new Date(),{timeZone:TZ,hour:'2-digit',hour12:false}));
}
function shift(iso,n){
  const [y,m,d]=iso.split('-').map(Number);
  const t=new Date(Date.UTC(y,m-1,d,12)+n*86400000);
  return fmt(t,{timeZone:'UTC',year:'numeric',month:'2-digit',day:'2-digit'});
}
const asDate = (iso)=>{ const [y,m,d]=iso.split('-').map(Number); return new Date(Date.UTC(y,m-1,d,12)); };
const pretty = (iso)=>new Intl.DateTimeFormat('en-CA',
  {weekday:'long',month:'long',day:'numeric',timeZone:'UTC'}).format(asDate(iso));
const weekday = (iso,len='long')=>new Intl.DateTimeFormat('en-CA',
  {weekday:len,timeZone:'UTC'}).format(asDate(iso));
const monthDay = (iso)=>new Intl.DateTimeFormat('en-CA',
  {month:'short',day:'numeric',timeZone:'UTC'}).format(asDate(iso));
const dayNum = (iso)=>Number(iso.slice(8));

// She plans at night, so after 6pm the sensible starting day is tomorrow.
// Between midnight and 6pm it's today — which is also right at 12:15am,
// when "tomorrow" in her head is the day that has already started.
function defaultDate(){
  const t = todayLocal();
  return localHour() >= 18 ? shift(t,1) : t;
}

/* Where the plan being edited sits relative to what Melody will see. */
function relation(d){
  const t = todayLocal();
  if (d < t) return 'past';
  if (d === t) return localHour() >= 18 ? 'today-evening' : 'today';
  if (d === shift(t,1)) return localHour() < 5 ? 'after-midnight-tomorrow' : 'tomorrow';
  return 'later';
}

/* The three ways v1 put a plan on the wrong day, found in the saved data:
   an evening save landing on that same day (Sep 7, Nov 9), and a save just
   after midnight landing two days ahead (Oct 26). Plus a page left open
   overnight, still pointing at a day that has passed. */
function wrongDayRisk(){
  const t = todayLocal();
  switch (relation(date)) {
    case 'past': return {
      title:`${weekday(date)} has already passed`,
      msg:`This page has been open since ${weekday(date)}. Liam's tablet is showing ${weekday(t)} now.`,
      alt:defaultDate()};
    case 'today-evening': return {
      title:`Save to today, ${weekday(date)}?`,
      msg:`It's evening, so ${weekday(date)} is nearly over. If this plan is for tomorrow, save it to ${weekday(shift(t,1))}.`,
      alt:shift(t,1)};
    case 'after-midnight-tomorrow': return {
      title:`Save to ${weekday(date)}?`,
      msg:`It's after midnight, so today is already ${weekday(t)}. If this plan is for the morning, save it to ${weekday(t)}.`,
      alt:t};
    default: return null;
  }
}

/* ------------------------------------------------- in-page confirm card */
function ask({title,msg,yes,no}){
  return new Promise((resolve)=>{
    const el = document.getElementById('ask');
    document.getElementById('ask-title').textContent = title;
    document.getElementById('ask-msg').textContent = msg;
    const y = document.getElementById('ask-yes'), n = document.getElementById('ask-no');
    y.textContent = yes; n.textContent = no;
    const done = (v)=>{ el.classList.remove('on'); y.onclick=n.onclick=el.onclick=null; resolve(v); };
    y.onclick = ()=>done('yes');
    n.onclick = ()=>done('no');
    el.onclick = (e)=>{ if (e.target === el) done('cancel'); };
    el.classList.add('on');
    y.focus();
  });
}

/* ----------------------------------------------------------- PIN gate */
async function unlock(){
  const val = document.getElementById('pin').value.trim();
  const err = document.getElementById('gate-err');
  if (!val) { err.textContent = 'Enter your PIN.'; return; }
  err.textContent = 'Checking…';
  pin = val;
  // Checks the PIN without writing anything at all.
  const res = await fetch('/api/save',{
    method:'POST',
    headers:{'content-type':'application/json','x-pin':pin},
    body:JSON.stringify({verify:true}),
  });
  if (res.status === 401){ err.textContent = 'That PIN is not right.'; pin=''; return; }
  if (!res.ok){ err.textContent = 'Could not reach the server. Try again.'; pin=''; return; }
  remember(PIN_KEY, pin);
  document.getElementById('gate').style.display='none';
  boot();
}
window.unlock = unlock;
document.getElementById('pin').addEventListener('keydown',e=>{ if(e.key==='Enter') unlock(); });

/* -------------------------------------------------------------- load */
async function load(d){
  const res = await fetch(`/api/day?date=${d}`,{cache:'no-store'});
  const body = await res.json();
  date = d;
  plan = body.plan;
  // The server combines standing + one-off notes for older clients; the
  // planner edits them separately.
  plan.notes = Array.isArray(body.dayNotes) ? [...body.dayNotes] : [...(plan.notes||[])];
  standing = Array.isArray(body.standingNotes) ? [...body.standingNotes] : [];
  library = body.library;
  contacts = body.contacts || [];
  dirty = false;
  loadedOn = todayLocal();
  render();
  loadSummary();
}

async function loadSummary(){
  try{
    const body = await fetch(`/api/day?summary=1&from=${todayLocal()}&days=${DAYS_AHEAD+1}`,
      {cache:'no-store'}).then(r=>r.json());
    planned = {};
    for (const d of body.days||[]) planned[d.date] = d.items;
    renderDays();
  }catch(e){ /* dots are a nicety; never block planning on them */ }
}

async function pickDate(d){
  if (d === date) return;
  if (dirty){
    const has = planned[d] > 0;
    const choice = await ask({
      title:`Your changes to ${weekday(date)} aren't saved`,
      msg: has ? `${weekday(d)} already has a plan. Moving these changes there will replace it when you save.`
               : `You can take what you've built over to ${weekday(d)}, or leave it and start ${weekday(d)} fresh.`,
      yes:`Move these changes to ${weekday(d)}`,
      no:`Discard them and open ${weekday(d)}`,
    });
    if (choice === 'cancel') return;
    if (choice === 'yes'){ date = d; dirty = true; render(); return; }
  }
  load(d);
}
window.pickDate = pickDate;

/* Copies the most recent day that actually has something saved. v1 copied
   literally yesterday, which on a Monday is an empty Sunday. */
async function copyLast(){
  const body = await fetch(`/api/day?latestBefore=${date}`,{cache:'no-store'}).then(r=>r.json());
  if (!body.date){ status('No saved plan in the last three weeks to copy.','bad'); return; }
  const src = body.plan;
  const next = {};
  for (const s of SECTIONS) if (s.key !== 'standing') next[s.key] = [...(src[s.key]||[])];
  // Standing notes are already on every day; don't copy them in twice.
  next.notes = next.notes.filter(id=>!standing.includes(id));
  plan = next; dirty = true; render();
  status(`Copied ${weekday(body.date)}, ${monthDay(body.date)}. Change what you need, then save.`,'good');
}
window.copyLast = copyLast;

/* ------------------------------------------------------------ render */
function itemById(pool,id){ return (library?.[pool]||[]).find(i=>i.id===id); }
const listOf = (key)=> key === 'standing' ? standing : (plan[key] ||= []);

function renderDays(){
  const t = todayLocal(); const h = localHour();
  const chips = [];
  for (let i=0;i<=DAYS_AHEAD;i+=1){
    const d = shift(t,i);
    // After midnight the word "Tomorrow" points at the day AFTER the one
    // Susan means (Oct 26). Leave it off then; the weekday does the work.
    const tag = i===0 ? 'Today' : (i===1 && h>=5 ? 'Tomorrow' : '');
    chips.push(`<button data-date="${d}" aria-pressed="${d===date}" onclick="pickDate('${d}')"
        aria-label="${esc(pretty(d))}${planned[d]>0?', has a plan':''}">
      <span class="tag">${tag}</span>
      <span class="wd">${weekday(d,'short')}</span>
      <span class="dn">${dayNum(d)}</span>
      <span class="dot${planned[d]>0?' on':''}"></span></button>`);
  }
  // A day left open overnight is no longer in the strip; show it anyway so
  // the highlighted chip always matches the header.
  if (date && date < t) chips.unshift(`<button data-date="${date}" aria-pressed="true">
      <span class="tag">Passed</span><span class="wd">${weekday(date,'short')}</span>
      <span class="dn">${dayNum(date)}</span><span class="dot"></span></button>`);
  const el = document.getElementById('daypick');
  el.innerHTML = chips.join('');
  el.querySelector('[aria-pressed="true"]')?.scrollIntoView({block:'nearest',inline:'nearest'});
}

function render(){
  const wd = weekday(date);
  const rel = relation(date);
  document.getElementById('head').textContent = `${wd}'s plan`;
  const where = {
    'past':'This day has passed',
    'today':"On Liam's tablet now",
    'today-evening':"Today — on Liam's tablet now",
    'tomorrow':"Liam's tablet shows this tomorrow morning",
    'after-midnight-tomorrow':`Liam's tablet shows this on ${wd}`,
    'later':`Liam's tablet shows this on ${wd}`,
  }[rel];
  document.getElementById('sub').textContent = `${pretty(date)} · ${where}`;
  document.getElementById('savebtn').textContent = `Save ${wd}'s plan`;

  const risk = wrongDayRisk();
  const warn = document.getElementById('warnline');
  warn.hidden = !risk;
  if (risk) warn.textContent = `⚠ ${risk.msg}`;

  renderDays();

  document.getElementById('app').innerHTML = SECTIONS.map(s=>{
    const ids = listOf(s.key);
    const rows = ids.map((id,i)=>{
      const it = itemById(s.pool,id);
      if (!it) return '';
      // The number IS the position. Tap order becomes display order.
      return `<li>
        <span class="num">${i+1}</span>
        <span class="txt">${esc(it.en)}${it.zh?`<span class="zh">${esc(it.zh)}</span>`:''}</span>
        <button class="mv" ${i===0?'disabled':''} onclick="move('${s.key}',${i},-1)" aria-label="Move up">▲</button>
        <button class="mv" ${i===ids.length-1?'disabled':''} onclick="move('${s.key}',${i},1)" aria-label="Move down">▼</button>
        <button class="rm" onclick="drop('${s.key}',${i})" aria-label="Remove">×</button>
      </li>`;
    }).join('');
    const accent = (s.accent || s.key).toLowerCase();
    return `<section data-key="${s.key}" style="--accent:var(--${accent})">
      <h2>${esc(s.title)}</h2>
      ${s.every ? `<p class="every">${esc(s.every())}</p>` : ''}
      <ol>${rows}</ol>
      <button class="add" onclick="openSheet('${s.key}')">+ Add ${esc(s.verb)}</button>
    </section>`;
  }).join('');
}

/* Reordering is a swap of two array positions. Nothing sorts, ever. */
function move(key,i,dir){
  const a = listOf(key); const j = i+dir;
  if (j<0 || j>=a.length) return;
  [a[i],a[j]] = [a[j],a[i]];
  dirty = true; render();
}
function drop(key,i){ listOf(key).splice(i,1); dirty = true; render(); }
window.move = move; window.drop = drop;

/* ------------------------------------------------------------- sheet */
function openSheet(key){
  sheetKey = key;
  const s = SECTIONS.find(x=>x.key===key);
  document.getElementById('sheet-title').textContent = `${s.title} — tap to add`;
  document.getElementById('newitem').value = '';
  document.getElementById('newitem').placeholder = `Type ${s.verb} that isn't listed…`;
  renderPool();
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeSheet(){
  sheetKey = null;
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}
window.openSheet = openSheet; window.closeSheet = closeSheet;

function renderPool(){
  const s = SECTIONS.find(x=>x.key===sheetKey);
  const chosen = listOf(sheetKey);
  document.getElementById('pool').innerHTML = (library[s.pool]||[]).map(it=>{
    const at = chosen.indexOf(it.id);
    return `<button aria-pressed="${at>=0}" onclick="toggle('${it.id}')">
      <span class="tick">${at>=0?`#${at+1}`:''}</span>
      <span class="txt">${esc(it.en)}${it.zh?`<span class="zh">${esc(it.zh)}</span>`:''}</span>
    </button>`;
  }).join('') || `<p style="color:var(--muted);margin:.5rem 0">Nothing saved here yet — type one above.</p>`;
}
function toggle(id){
  const arr = listOf(sheetKey);
  const at = arr.indexOf(id);
  if (at>=0) arr.splice(at,1); else arr.push(id);   // push = appended in tap order
  dirty = true; renderPool(); render();
}
window.toggle = toggle;

function addNew(){
  const input = document.getElementById('newitem');
  const text = input.value.trim();
  if (!text) return;
  const s = SECTIONS.find(x=>x.key===sheetKey);
  // New items join the permanent library, so it's type once, tap forever.
  const id = `${s.pool[0]}${Date.now().toString(36)}${Math.floor(Math.random()*999)}`;
  library[s.pool].push({id, en:text, zh:''});
  listOf(sheetKey).push(id);
  input.value = '';
  dirty = true; renderPool(); render();
}
window.addNew = addNew;

/* ---------------------------------------------------------- contacts */
function openContacts(){
  const current = contacts.map(c=>`${c.label} | ${c.phone}`).join('\n');
  const next = prompt(
    'One per line:  Name | Number\n\nThese show on Liam\'s tablet.', current);
  if (next === null) return;
  contacts = next.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const [label,...rest] = l.split('|');
    return {label:(label||'').trim(), phone:rest.join('|').trim()};
  }).filter(c=>c.label);
  dirty = true;
  status('Contacts updated — remember to save.','good');
}
window.openContacts = openContacts;

/* -------------------------------------------------------------- save */
let toastTimer = null;
function showToast(msg, ok = true, autoHide = true){
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast-mark').textContent = ok ? '✓' : '!';
  document.getElementById('toast-dismiss').hidden = autoHide;
  t.classList.toggle('bad', !ok);
  t.classList.add('on');
  clearTimeout(toastTimer);
  // Success fades by itself; a failure stays until she acknowledges it.
  if (autoHide) toastTimer = setTimeout(hideToast, 4200);
}
function hideToast(){
  clearTimeout(toastTimer);
  document.getElementById('toast').classList.remove('on');
}
window.hideToast = hideToast;
// Kept for the small in-page messages (copy last plan, contacts).
function status(msg, kind = ''){ showToast(msg, kind !== 'bad'); }

function savedMessage(d){
  const when = {
    'today':"It's on Liam's tablet now.",
    'today-evening':"It's on Liam's tablet now.",
    'tomorrow':"Liam's tablet shows it tomorrow morning.",
  }[relation(d)] || `Liam's tablet shows it on ${weekday(d)}.`;
  return `Saved ${weekday(d)}, ${monthDay(d)}. ${when}`;
}

async function saveAll(){
  const risk = wrongDayRisk();
  if (risk && !okayed.has(date)){
    const choice = await ask({
      title: risk.title, msg: risk.msg,
      yes: `Save to ${weekday(risk.alt)} instead`,
      no: relation(date) === 'past' ? 'Cancel' : `No, save to ${weekday(date)}`,
    });
    if (choice === 'cancel') return;
    if (choice === 'yes') date = risk.alt;
    else if (relation(date) === 'past') return;
    else okayed.add(date);
  }

  const btn = document.getElementById('savebtn');
  const label = `Save ${weekday(date)}'s plan`;
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const res = await fetch('/api/save',{
      method:'POST',
      headers:{'content-type':'application/json','x-pin':pin},
      body:JSON.stringify({date, plan, standingNotes: standing, library, contacts}),
    });
    if (res.status === 401){
      showToast('That PIN was rejected. Nothing was saved.', false, false);
      btn.disabled = false; btn.textContent = label; return;
    }
    if (!res.ok) throw new Error(res.status);
    dirty = false;
    render();                     // header and button follow a switched day
    // Three signals at once: the button changes, a banner covers it, and
    // screen readers are told. There is no way to miss this and wonder.
    btn.textContent = '✓ Saved'; btn.classList.add('done');
    showToast(savedMessage(date), true);
    setTimeout(()=>{ btn.textContent = `Save ${weekday(date)}'s plan`; btn.classList.remove('done'); }, 3200);
    loadSummary();
  }catch(e){
    // Susan's input stays on screen. Never silently lose a plan.
    showToast('Could not save. Your plan is still here — try again.', false, false);
    btn.textContent = label;
  }
  btn.disabled = false;
}
window.saveAll = saveAll;

addEventListener('beforeunload', (e)=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

/* ---------------------------------------------- coming back to the page */
// iPhones keep a Safari page alive in the background for hours without
// reloading it. A planner opened at lunch and picked up again at 10pm was
// still sitting on lunchtime's day — the Nov 9 bug. When she comes back
// after a while (or the date has rolled over), start from the right day.
function onReturn(){
  if (!pin || !date) return;
  const rolled = todayLocal() !== loadedOn;
  const away = hiddenAt && (Date.now() - hiddenAt > AWAY_MS);
  hiddenAt = 0;
  if (!rolled && !away) return;
  if (!dirty) load(defaultDate());
  else render();               // keep her work; the warning line explains the day
}
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden) hiddenAt = Date.now(); else onReturn();
});
addEventListener('pageshow', (e)=>{ if (e.persisted){ hiddenAt = hiddenAt || 1; onReturn(); } });
// Crossing 6pm or midnight with the page open changes what's "right".
setInterval(()=>{ if (date && !document.hidden) render(); }, 60000);

/* -------------------------------------------------------------- boot */
function boot(){ load(defaultDate()); }

(function start(){
  const saved = recall(PIN_KEY);
  if (saved){ document.getElementById('pin').value = saved; unlock(); }
  else document.getElementById('pin').focus();
  // Same safety net as the board. Susan can't save without a connection
  // anyway, but the page opening beats an error screen.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
})();

</script>
</body>
</html>
